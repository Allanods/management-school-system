<header class="app-topbar">
  <div class="d-flex align-items-center justify-content-between gap-2">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-light d-lg-none" type="button" data-bs-toggle="offcanvas"
              data-bs-target="#appSidebar" aria-controls="appSidebar">
        <i class="bi bi-list fs-5"></i>
      </button>
      <h1 class="page-title mb-0">{% block page_title %}{{ page_title|default:"Dashboard" }}{% endblock %}</h1>
    </div>

    <div class="d-flex align-items-center gap-2">
      {% if user_profile %}
        <div class="dropdown">
          <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button"
                  data-bs-toggle="dropdown" aria-expanded="false">
            <span class="user-avatar">{{ user_profile.user.username|slice:":2"|upper }}</span>
            <span class="d-none d-md-inline">{{ user_profile.user.get_full_name|default:user_profile.user.username }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <span class="dropdown-item-text">
                <strong>{{ user_profile.get_role_display }}</strong><br>
                <span class="text-subtle small">{{ user_profile.user.email|default:"No email set" }}</span>
              </span>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item" href="{% url 'accounts:password_change' %}">
                <i class="bi bi-key me-2"></i>Change password
              </a>
            </li>
            <li>
              <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="dropdown-item">
                  <i class="bi bi-box-arrow-right me-2"></i>Log out
                </button>
              </form>
            </li>
          </ul>
        </div>
      {% endif %}
    </div>
  </div>
</header>
