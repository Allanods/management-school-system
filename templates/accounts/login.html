{% extends 'base.html' %}

{% block title %}Sign in - SchoolManager{% endblock %}

{% block auth_content %}
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="brand-icon mb-3"><i class="bi bi-mortarboard-fill"></i></span>
      <h1 class="h4 mb-1 fw-bold">SchoolManager</h1>
      <p class="text-subtle mb-0">Sign in to your account</p>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger py-2">
        Your username and password did not match. Please try again.
      </div>
    {% endif %}

    <form method="post" action="{% url 'accounts:login' %}" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" id="id_username"
                 autofocus autocomplete="username" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" id="id_password"
                 autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
        <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
      </button>
    </form>

    <p class="text-center text-subtle small mt-3 mb-0">
      <a href="{% url 'accounts:password_reset' %}">Forgot your password?</a>
    </p>
  </div>
{% endblock %}
