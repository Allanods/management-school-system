{% extends 'base.html' %}

{% block title %}Password reset complete - SchoolManager{% endblock %}

{% block auth_content %}
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="brand-icon mb-3"><i class="bi bi-check2-circle"></i></span>
      <h1 class="h4 mb-1 fw-bold">Password reset complete</h1>
      <p class="text-subtle mb-0">
        Your password has been set successfully. You can now sign in with it.
      </p>
    </div>
    <p class="text-center text-subtle small mb-0">
      <a href="{% url 'accounts:login' %}">Sign in</a>
    </p>
  </div>
{% endblock %}
