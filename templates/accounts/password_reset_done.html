{% extends 'base.html' %}

{% block title %}Check your inbox - SchoolManager{% endblock %}

{% block auth_content %}
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="brand-icon mb-3"><i class="bi bi-envelope-check"></i></span>
      <h1 class="h4 mb-1 fw-bold">Check your inbox</h1>
      <p class="text-subtle mb-0">
        If an account exists for that address, we have emailed you a link to
        reset your password. You should receive it shortly.
      </p>
    </div>
    <p class="text-center text-subtle small mb-0">
      <a href="{% url 'accounts:login' %}">Back to sign in</a>
    </p>
  </div>
{% endblock %}
