{% extends 'base.html' %}

{% block title %}Password Changed - SchoolManager{% endblock %}

{% block content %}
  <div class="card card-body-section mx-auto" style="max-width:520px;">
    <div class="card-body text-center py-5">
      <span class="stat-icon bg-soft-success mb-3 d-inline-flex">
        <i class="bi bi-check-lg text-success"></i>
      </span>
      <h1 class="h4 mb-2">Password changed</h1>
      <p class="text-subtle mb-4">Your password has been updated successfully.</p>
      <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary">
        <i class="bi bi-speedometer2 me-1"></i>Go to Dashboard
      </a>
    </div>
  </div>
{% endblock %}
